[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-hunter"
version = "1.0.0"
description = "Private, local AI-assisted job-search assistant (configurable region and field)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "Protego>=0.6.2",   # 0.6.2 fixes CVE-2026-55520 (ReDoS)
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "trafilatura>=1.12",
    "pypdf>=4.0",
    "python-jobspy>=1.4",   # LinkedIn/Indeed/Glassdoor (user decision 2026-11-15)
    "anthropic>=2.8",       # Claude API backend (llm.backend: api)
    "python-docx>=1.1",     # CV / cover letter .docx (Phase 4)
    "docx2pdf>=0.1.8",      # .docx -> .pdf through Microsoft Word (Phase 4)
    "streamlit>=1.40",      # local dashboard (Phase 6)
    "Jinja2>=3.1",          # daily HTML report (Phase 7)
    "ruamel.yaml>=0.18",    # Settings page: edits config files without losing their comments
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
ignore = ["E501", "E701", "E702", "SIM108", "UP017",
          "SIM102", "SIM105"]   # nested ifs / explicit try-except kept on purpose: easier to read

[tool.coverage.run]
source = ["vjh"]
omit = ["*/migrations/*"]

[project.scripts]
vjh = "vjh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vjh = ["db/migrations/*.py", "db/migrations/versions/*.py", "db/migrations/*.mako", "db/alembic.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
