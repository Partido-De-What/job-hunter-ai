# ---------- Stage 1 relevance filter (Phase 3) ----------
# A job passes if its TITLE matches one title pattern, or its TEXT contains at least
# `min_topic_matches` different topic patterns. Patterns are regular expressions,
# matched case-insensitively at the start of a word (so "labor" matches "Laborant").
relevance:
  min_topic_matches: 3
  # Titles that need a degree/status the candidate does not have. Set aside BEFORE the AI
  # (saves money); still visible with `vjh jobs --status filtered_out`. Remove a line to allow it.
  exclude_title_patterns:
    - "post-?doc"                                     # requires a PhD
    - "postdoctoral"
    - "master'?s?['’]? (?:thesis|student|internship|position)"   # for current MSc students
    - "masterarbeit"
    - "bachelor'?s? thesis|bachelorarbeit"
    - "professor|tenure.track|laufbahnstelle"
    - "lehrberuf|lehrling|lehrstelle|apprentice"
  title_patterns:
    - pflanz
    - agrar
    - agronom
    - saat
    - züch
    - zucht
    - labor
    - lab\b
    - biolog
    - biotech
    - bioinform
    - molekul
    - molecul
    - genet
    - genom
    - qualitätskontroll
    - qualitätssicherung
    - quality control
    - qc\b
    - analyt
    - research
    - forschung
    - scientist
    - wissenschaftl
    - crop
    - seed
    - plant\b
    - plant (?:scien|bio|breed|path|physio)
    - breed
    - phenotyp
    - greenhouse
    - gewächshaus
    - soil
    - boden
    - mikrobio
    - microbio
    - chemi
    - pharma
    - life scien
    - postdoc
    - phd\b
    - technical assistant
    - technische\S* ?assist     # also Technische*r / Technische:r Assistent*in
    - versuch
    - feldversuch
    - umwelt
    - environment
  topic_patterns:
    - pcr\b
    - genotyp
    - molekularbiolog
    - molecular biolog
    - pflanze
    - plants?\b
    - agronom
    - züchtung
    - breeding
    - biotechnolog
    - laborator
    - laborarbeit
    - qualitätskontroll
    - quality control
    - hplc
    - field trial
    - feldversuch
    - seeds?\b
    - saatgut
    - mikrobiolog
    - microbiolog
    - cell culture
    - zellkultur
    - assay
    - genetic
    - genetik
    - arabidopsis
    - wheat
    - weizen
    - crop
    - phenotyp
    - gewächshaus
    - greenhouse
    - soil
    - bodenanalys
    - gmp\b
