# Search terms. >>> EXAMPLE for a life-science job search in a German-speaking country. <<<
# Replace them with words for YOUR field and the languages of YOUR job market (the list
# names "german" / "english" are only labels - use any languages). Claude Code can draft
# them with you from your profile (CLAUDE.md, "New user setup").
#
# - core_queries: short searches used by query-based sources (e.g. JobSpy, if you enable it)
# - relevance: the free Stage 1 filter. A job passes if its TITLE matches a title pattern or its
#   TEXT contains at least `min_topic_matches` topic patterns. exclude_title_patterns sets aside
#   titles that need a degree or status you do not have.

